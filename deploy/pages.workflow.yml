name: Deploy to GitHub Pages

on:
  push:
    branches:
      - cline/wd0578zj
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Тесты и сборка
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Тесты (валидация, API, разметка)
        run: npm test

      - name: Сборка статической версии
        run: npm run build

      - name: Настроить Pages
        uses: actions/configure-pages@v5

      - name: Загрузить артефакт
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: Публикация
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Опубликовать на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
